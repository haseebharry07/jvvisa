<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Admin Panel | jvvisa</title>
    <link rel="shortcut icon" href="assets/images/logo.png" type="image/x-icon"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
    <link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body>

<div id="wrapwrap">
    <header id="top" class="o_header_standard bg-white">
        <nav class="navbar navbar-expand-lg navbar-light pt-3 shadow-sm">
            <div class="container flex-wrap justify-content-between">
                <a href="index.html" class="navbar-brand">
                    <img src="assets/images/logo.png" width="95" height="40" alt="jvvisa"/>
                </a>
                <a href="#" id="logout-btn" class="btn btn-outline-secondary">Logout</a>
            </div>
        </nav>
    </header>

    <main class="py-5 bg-light" style="min-height: 80vh;">
        <div class="container">
            <h2 class="fw-bold mb-4">Visa Records Admin Panel</h2>

            <div id="panel-alert" class="alert d-none" role="alert"></div>

            <!-- Add Record Form -->
            <div class="card border-0 shadow-sm mb-5">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-3">Add New Visa Record</h5>
                    <form id="add-record-form" novalidate>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Visa No</label>
                                <input type="text" class="form-control" id="visaNo" required/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Passport No</label>
                                <input type="text" class="form-control" id="passportNo" required/>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Images (you can select multiple)</label>
                                <input type="file" class="form-control" id="images" accept="image/*" multiple required/>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary mt-4 px-4" id="add-record-btn">
                            Add Record
                        </button>
                    </form>
                </div>
            </div>

            <!-- Records Table -->
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-3">All Records</h5>
                    <div class="table-responsive">
                        <table class="table table-bordered align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Visa No</th>
                                    <th>Passport No</th>
                                    <th>Images</th>
                                    <th>Created</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="records-table-body">
                                <tr><td colspan="5" class="text-center text-muted">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Details Modal -->
<div class="modal fade" id="detailsModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Visa Record Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="details-modal-body">
                <!-- filled dynamically -->
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/panel.js"></script>
</body>
</html>
